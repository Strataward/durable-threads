name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Run lint
        run: ruff check .
      - name: Compile sources
        run: python -m compileall -q src scripts
      - name: Validate repository packaging
        run: python scripts/validate_repo.py

  durable:
    name: Temporal + Jev integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install durable mode
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,durable]'
      - name: Import integration surfaces
        run: |
          python - <<'PY'
          from typesafe_sdk import Choice, Noul, Score

          from durable_threads.decisions import JevDecisionEngine
          from durable_threads.temporal_contracts import TaskRunInput
          from durable_threads.temporal_workflows import AgentExecutionWorkflow, DurableTaskWorkflow

          Noul(instructions="Is the task bounded?")
          Choice(instructions="Choose a route", criteria={"worker": None, "review": None})
          Score(instructions="Score the evidence", criteria=["weak", "strong"])
          JevDecisionEngine()
          TaskRunInput(
              objective="Smoke test durable mode",
              allowed_paths=["src/**"],
              acceptance=["imports work"],
              cwd=".",
          )
          assert AgentExecutionWorkflow is not None
          assert DurableTaskWorkflow is not None
          PY
      - name: Run durable-mode unit tests
        run: |
          python -m pytest \
            tests/test_decision_intelligence.py \
            tests/test_execution_registry.py \
            tests/test_temporal_contracts.py \
            tests/test_heuristic_engine.py \
            tests/test_scripted_executor.py \
            tests/test_temporal_workflows.py

  package:
    name: Release archive
    runs-on: ubuntu-latest
    needs: [test, durable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate and package
        run: |
          python scripts/validate_repo.py
          python scripts/build_release.py --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: durable-threads-package
          path: dist/*.zip
