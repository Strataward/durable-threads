name: Pro5 native diagnostics
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    name: Metadata and policy / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Run offline diagnostics tests (no account or model calls)
        run: node --test tests/pro5_checks.mjs
