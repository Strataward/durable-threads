name: Bug report
description: Report a reproducible problem.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private source, family data, or raw transcripts.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which release or commit shows the problem?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Give the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
